name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Mechanism and auth tests
        env:
          JWT_AUTH_DISABLED: "1"
          INBOUND_AUTH_DISABLED: "1"
          ENABLE_JOB_WORKER: "false"
          SECRET_KEY: "ci-test-secret-not-for-production"
        run: |
          python -m pytest \
            tests/test_mechanism_grounding.py \
            tests/test_mechanism_name_links.py \
            tests/test_mechanism_foreign_keys.py \
            tests/test_fk_benchmark.py \
            tests/test_confidence_fit.py \
            tests/test_auth_enterprise.py \
            tests/test_ontology_export_rdf_owl.py \
            tests/test_phase5_enterprise.py \
            -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
