# Weave on the shared Azure VM (rapid-build-dev-server).
# Caddy publishes 80 and 443 for cuweave.com. Postgres and the API stay private.
# Do not use ports 22, 3000, 5173, or 8000 — those belong to SSH, SEAL, and SciNova.
#
# Point GoDaddy at 20.127.186.132 before the first start so Let's Encrypt can issue.
#   cp env.azure.example .env
#   # paste OPENAI_API_KEY into .env on the VM only
#   sudo docker compose -f docker-compose.azure.yml up -d --build

name: weave-azure

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_fabric
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - weave

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_db
      - backend_models:/app/models
      - backend_data:/app/data
      - backend_ontology:/app/ontology_data
    environment:
      - PYTHONPATH=/app
      - HOST=0.0.0.0
      - PORT=8000
      - KF_DATA_DIR=/app/data
      - KF_MODELS_DIR=/app/models
      - KF_UPLOAD_DIR=/app/uploads
      - KF_CHROMA_DIR=/app/chroma_db
      - KF_ONTOLOGY_DATA_DIR=/app/ontology_data
      - KF_ONTOLOGY_UPLOAD_DIR=/app/ontology_data/uploads
      - DATABASE_URL=postgresql://knowledge_user:${POSTGRES_PASSWORD:-knowledge_pass}@postgres:5432/knowledge_fabric
      - USE_GRAPH_RETRIEVAL=true
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - UPLOAD_DIR=/app/uploads
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - KF_CORS_ORIGINS=${KF_CORS_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://exxondemofdr.cognitiveservices.azure.com/openai/v1}
      - OPENAI_QUERY_MODEL=${OPENAI_QUERY_MODEL:-gpt-5-mini}
      - ONTOLOGY_LLM_MODEL=${ONTOLOGY_LLM_MODEL:-gpt-5-mini}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      - ONTOLOGY_LLM_PROVIDER=${ONTOLOGY_LLM_PROVIDER:-openai}
      - BEDROCK_ENABLED=false
      - ENABLED_LLM_PROVIDERS=${ENABLED_LLM_PROVIDERS:-openai}
    depends_on:
      - postgres
    networks:
      - weave
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://cuweave.com}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - weave

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - WEAVE_DOMAIN=${WEAVE_DOMAIN:-cuweave.com}
      - WEAVE_UPSTREAM=${WEAVE_UPSTREAM:-web:80}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - weave

volumes:
  postgres_data:
  backend_uploads:
  backend_chroma:
  backend_models:
  backend_data:
  backend_ontology:
  caddy_data:
  caddy_config:

networks:
  weave:
    driver: bridge
